publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: 6.1.5+1
  http: 1.6.0
  cryptography: 2.9.0
  flutter_secure_storage: 9.2.4
  path_provider: 2.1.6
  file_picker: 9.2.3
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
