name: morphhealth
description: "MorphHealth — persönliches Gesundheitstagebuch (Ernährung, Zyklus, Gewicht, Symptome). Lokal, verschlüsselt, ohne Konto."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Reiner Dart-HTTP-Client (dart:io) — nutzt den System-Trust-Store von Android.
  http: ^1.6.0
  # App-private Verzeichnisse (Datenbestand + Schlüsseldatiei).
  path_provider: ^2.1.6
  # Storage-Access-Framework-Dateiwähler (keine Speicherberechtigungen nötig).
  file_picker: ^13.1.0
  # Reine Dart-Kryptografie (AES-256-GCM, PBKDF2) — funktioniert in App und CLI.
  cryptography: ^2.9.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
