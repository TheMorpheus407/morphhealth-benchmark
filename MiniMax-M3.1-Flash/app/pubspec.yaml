name: morphhealth
description: "MorphHealth — lokales Ernährungs-, Zyklus-, Gewichts- und Symptomtagebuch"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared, pure Dart product core. The same code runs in the `mh` CLI.
  morphhealth_core:
    path: packages/morphhealth_core

  cupertino_icons: 1.0.8
  file_selector: 1.1.0
  intl: 0.20.2
  path: 1.9.1
  path_provider: 2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
